<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalorie</title>

<style>
body {
    font-family: Arial;
    margin: 15px;
    background: #f5f5f5;
}

.section {
    background: white;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 12px;
}

input, button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>🍽️ Kalorie</h1>

<div class="section">
<h3>Přidat jídlo</h3>

<input list="foods" id="foodName" placeholder="Začni psát jídlo...">
<datalist id="foods"></datalist>

<input type="number" id="grams" placeholder="Gramáž (např. 150)">
<input type="number" id="kcal100" placeholder="kcal na 100 g (doplní se automaticky)">

</div>

<div id="sections"></div>

<script>
let sections = ["Snídaně", "Svačina", "Oběd", "Svačina 2", "Večeře"];
let today = new Date().toISOString().split('T')[0];

let foodDB = {
"rohlík":265,
"chléb bílý":240,
"chléb celozrnný":220,
"houska":270,
"toastový chléb":260,
"bageta":270,

"kuřecí prsa":165,
"kuřecí řízek":250,
"vepřové maso":290,
"hovězí maso":250,
"šunka":120,
"slanina":500,

"rýže vařená":130,
"těstoviny vařené":155,
"brambory vařené":90,
"hranolky":310,

"mléko polotučné":50,
"jogurt bílý":60,
"jogurt ovocný":95,
"tvaroh":120,
"sýr eidam":300,
"sýr tvrdý":350,

"banán":105,
"jablko":52,
"pomeranč":47,

"vejce":155,

"protein":400,
"proteinová tyčinka":380
};

let datalist = document.getElementById("foods");
Object.keys(foodDB).forEach(food => {
    let option = document.createElement("option");
    option.value = food;
    datalist.appendChild(option);
});

document.getElementById("foodName").addEventListener("input", function() {
    let name = this.value.toLowerCase();
    if(foodDB[name]) {
        document.getElementById("kcal100").value = foodDB[name];
    }
});

function getKey(section){
    return today + "_" + section;
}

function createSections(){
    let container = document.getElementById("sections");
    sections.forEach(sec=>{
        let div=document.createElement("div");
        div.className="section";
        div.innerHTML=`
        <h3>${sec}</h3>
        <button onclick="addFood('${sec}')">Přidat jídlo</button>
        <ul id="list-${sec}"></ul>
        `;
        container.appendChild(div);
        loadSection(sec);
    });
}

function addFood(section){
    let name=document.getElementById("foodName").value;
    let grams=document.getElementById("grams").value;
    let kcal100=document.getElementById("kcal100").value;

    if(!name||!grams||!kcal100) return;

    let kcal=Math.round((grams/100)*kcal100);

    let key=getKey(section);
    let data=JSON.parse(localStorage.getItem(key)||"[]");

    data.push({
        name:name,
        grams:grams,
        kcal:kcal
    });

    localStorage.setItem(key,JSON.stringify(data));
    loadSection(section);
}

function loadSection(section){
    let list=document.getElementById("list-"+section);
    list.innerHTML="";

    let data=JSON.parse(localStorage.getItem(getKey(section))||[]);
    data.forEach(item=>{
        let li=document.createElement("li");
        li.innerText=`${item.name} ${item.grams} g – ${item.kcal} kcal`;
        list.appendChild(li);
    });
}

createSections();
</script>

</body>
</html>
