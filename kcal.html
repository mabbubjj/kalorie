<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<script src="https://unpkg.com/@zxing/library@latest"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalorie</title>

<style>
body {
    font-family: Arial;
    margin: 15px;
    background: #f5f5f5;
}

.section {
    background: white;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 12px;
}

input, button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    font-size: 16px;
}

.quick button{
    width:24%;
}
</style>
</head>

<body>

<h1>🍽️ Kalorie</h1>

<div id="limitSetup" class="section">
<h3>Nastav denní limit kcal</h3>
<input type="number" id="limitInput" placeholder="Např. 2200">
<button onclick="saveLimit()">Uložit</button>
</div>

<div id="main" style="display:none">

<h2>Limit: <span id="limit"></span> kcal</h2>
<h2>Snědeno: <span id="total">0</span> kcal</h2>
<h2>Zbývá: <span id="left">0</span> kcal</h2>

<div class="section">
<h3>Přidat jídlo</h3>
<button onclick="scanBarcode()">📷 Naskenovat čárový kód</button>
<input type="file" id="barcodeInput" accept="image/*" capture="environment" style="display:none">
<input list="foods" id="foodName" placeholder="Začni psát jídlo...">
<datalist id="foods"></datalist>

<input type="number" id="grams" placeholder="Gramáž">

<div class="quick">
<button onclick="setGrams(50)">50 g</button>
<button onclick="setGrams(100)">100 g</button>
<button onclick="setGrams(150)">150 g</button>
<button onclick="setGrams(200)">200 g</button>
</div>

<input type="number" id="kcal100" placeholder="kcal na 100 g">
</div>

<div id="sections"></div>

<div class="section">
<h3>📅 Historie</h3>
<div id="history"></div>
</div>

</div>

<script>
let sections=["Snídaně","Svačina","Oběd","Svačina 2","Večeře"];
let today=new Date().toISOString().split('T')[0];

let foodDB={
"rohlík":265,"chléb bílý":240,"chléb celozrnný":220,"houska":270,"toastový chléb":260,
"kuřecí prsa":165,"kuřecí řízek":250,"vepřové maso":290,"hovězí maso":250,"šunka":120,
"rýže vařená":130,"těstoviny vařené":155,"brambory vařené":90,"hranolky":310,
"mléko polotučné":50,"jogurt bílý":60,"jogurt ovocný":95,"tvaroh":120,"sýr eidam":300,
"banán":105,"jablko":52,"vejce":155,"protein":400
};

let datalist=document.getElementById("foods");
Object.keys(foodDB).forEach(food=>{
 let o=document.createElement("option");
 o.value=food;
 datalist.appendChild(o);
});

document.getElementById("foodName").addEventListener("input",function(){
 let name=this.value.toLowerCase();
 if(foodDB[name]){
   document.getElementById("kcal100").value=foodDB[name];
 }
});

function setGrams(g){
 document.getElementById("grams").value=g;
}

function saveLimit(){
 let limit=document.getElementById("limitInput").value;
 localStorage.setItem("limit",limit);
 startApp();
}

function startApp(){
 let limit=localStorage.getItem("limit");
 if(!limit)return;

 document.getElementById("limitSetup").style.display="none";
 document.getElementById("main").style.display="block";

 document.getElementById("limit").innerText=limit;

 createSections();
 updateTotal();
 renderHistory();
}

function getKey(section,date=today){
 return date+"_"+section;
}

function createSections(){
 let container=document.getElementById("sections");
 sections.forEach(sec=>{
  let div=document.createElement("div");
  div.className="section";
  div.innerHTML=`
  <h3>${sec}</h3>
  <button onclick="addFood('${sec}')">Přidat jídlo</button>
  <ul id="list-${sec}"></ul>
  `;
  container.appendChild(div);
  loadSection(sec);
 });
}

function addFood(section){
 let name=document.getElementById("foodName").value;
 let grams=document.getElementById("grams").value;
 let kcal100=document.getElementById("kcal100").value;
 if(!name||!grams||!kcal100)return;

 let kcal=Math.round((grams/100)*kcal100);

 let key=getKey(section);
 let data=JSON.parse(localStorage.getItem(key)||"[]");

 data.push({name,grams,kcal});
 localStorage.setItem(key,JSON.stringify(data));

 loadSection(section);
 updateTotal();
 renderHistory();
}

function loadSection(section){
 let list=document.getElementById("list-"+section);
 list.innerHTML="";

 let data=JSON.parse(localStorage.getItem(getKey(section))||[]);
 data.forEach((item,i)=>{
  let li=document.createElement("li");
  li.innerText=`${item.name} ${item.grams} g – ${item.kcal} kcal`;
  li.onclick=()=>removeItem(section,i);
  list.appendChild(li);
 });
}

function removeItem(section,index){
 let key=getKey(section);
 let data=JSON.parse(localStorage.getItem(key)||"[]");
 data.splice(index,1);
 localStorage.setItem(key,JSON.stringify(data));
 loadSection(section);
 updateTotal();
 renderHistory();
}

function updateTotal(){
 let total=0;
 sections.forEach(sec=>{
  let data=JSON.parse(localStorage.getItem(getKey(sec))||[]);
  data.forEach(item=>total+=item.kcal);
 });

 let limit=Number(localStorage.getItem("limit"));
 document.getElementById("total").innerText=total;
 document.getElementById("left").innerText=limit-total;
}

function renderHistory(){
 let div=document.getElementById("history");
 div.innerHTML="";

 let dates=new Set();

 Object.keys(localStorage).forEach(key=>{
  sections.forEach(sec=>{
   if(key.includes("_"+sec)){
    dates.add(key.split("_")[0]);
   }
  });
 });

 let limit=Number(localStorage.getItem("limit"));

 [...dates].sort().reverse().forEach(date=>{
  let total=0;
  sections.forEach(sec=>{
   let data=JSON.parse(localStorage.getItem(getKey(sec,date))||[]);
   data.forEach(item=>total+=item.kcal);
  });

  let row=document.createElement("div");
  row.innerText=`${date} — ${total} kcal`;
  div.appendChild(row);
 });
}

startApp();
    setTimeout(updateTotal, 200);
function scanBarcode(){
    document.getElementById('barcodeInput').click();
}

document.getElementById('barcodeInput').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;

    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);

    const codeReader = new ZXing.BrowserBarcodeReader();

    codeReader.decodeFromImage(img)
        .then(result => {
    const ean = result.text;

    alert("Načtený kód: " + ean);

    fetch("https://world.openfoodfacts.org/api/v0/product/" + ean + ".json")
        .then(res => res.json())
        .then(data => {
            if(data.status === 1){
                const product = data.product;

                document.getElementById("foodName").value = product.product_name || "Neznámý produkt";

                const kcal = product.nutriments?.["energy-kcal_100g"];
                if(kcal){
                    document.getElementById("kcal100").value = Math.round(kcal);
                }
            } else {
                alert("Produkt nebyl v databázi nalezen.");
            }
        })
        .catch(() => {
            alert("Nepodařilo se načíst produkt z databáze.");
        });
})

        .catch(err => {
            alert("Kód se nepodařilo přečíst. Zkus lepší světlo.");
        });
});

    
</script>

</body>
</html>
