<h1>🍽️ Kalorie</h1>

<div class="section">
<h3>🔎 Hledat potravinu</h3>
<input id="search" placeholder="Např. milka, šunka, pasta">
<button onclick="searchFood()">Hledat v databázi</button>
    <div id="results"></div>

<input type="number" id="grams" placeholder="Gramáž (např. 150)">

<div id="sections"></div>

<script>
let sections = ["Snídaně", "Svačina", "Oběd", "Svačina 2", "Večeře"];
let today = new Date().toISOString().split('T')[0];

function getKey(section) {
    return today + "_" + section;
}

function createSections() {
    let container = document.getElementById("sections");
    sections.forEach(sec => {
        let div = document.createElement("div");
        div.className = "section";
        div.innerHTML = `
            <h3>${sec}</h3>
            <button onclick="addFood('${sec}')">Přidat vybranou potravinu</button>
            <ul id="list-${sec}"></ul>
        `;
        container.appendChild(div);
        loadSection(sec);
    });
}

function searchFood() {
    let q = document.getElementById("search").value;
    let results = document.getElementById("results");

    results.innerHTML = "Hledám...";

    fetch(`https://world.openfoodfacts.org/api/v2/search?categories_tags_en=${q}&fields=product_name,nutriments&limit=20`)
    .then(res => res.json())
    .then(data => {
        results.innerHTML = "";

        if (!data.products || data.products.length === 0) {
            results.innerHTML = "Nic nenalezeno";
            return;
        }

        data.products.forEach(p => {
            let kcal = p?.nutriments?.["energy-kcal_100g"];
            let name = p.product_name;

            if (!kcal || !name) return;

            let div = document.createElement("div");
            div.className = "result";
            div.innerText = `${name} (${kcal} kcal / 100g)`;

            div.onclick = () => {
                document.getElementById("kcal100").value = kcal;
                document.getElementById("search").value = name;
            };

            results.appendChild(div);
        });

        if (results.innerHTML === "") {
            results.innerHTML = "Našel jsem produkty, ale bez kcal údajů.";
        }
    })
    .catch(err => {
        results.innerHTML = "Chyba při načítání databáze.";
        console.error(err);
    });
}
